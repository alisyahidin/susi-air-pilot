info:
  name: Flight Hours Limits
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/flight-hours/limits?date=2026-05-15"
  params:
    - name: date
      value: "2026-05-15"
      type: query
      description: Day the rolling windows end on (YYYY-MM-DD); the frontend sends TODAY from nuxt/.env. Disable it to use the server's today (UTC).
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
