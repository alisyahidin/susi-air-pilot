info:
  name: Schedules
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/schedules?year=2026&month=5"
  params:
    - name: year
      value: "2026"
      type: query
      description: With month, the month to load. Disable both to use the month of the API's TODAY.
    - name: month
      value: "5"
      type: query
      description: 1 to 12
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
