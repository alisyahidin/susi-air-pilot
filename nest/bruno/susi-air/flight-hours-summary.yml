info:
  name: Flight Hours Summary
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/flight-hours/summary?range=1w&date=2026-05-15"
  params:
    - name: range
      value: 1w
      type: query
      description: "1w, 1m, 3m, 6m or 1y: the rolling window and limit each point is measured against (default 1w)"
    - name: date
      value: "2026-05-15"
      type: query
      description: Day the chart centres on (YYYY-MM-DD); the frontend sends TODAY from nuxt/.env. Disable it to use the API's TODAY.
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
