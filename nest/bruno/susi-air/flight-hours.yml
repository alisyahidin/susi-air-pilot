info:
  name: Flight Hours
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/flight-hours?from=2026-05-01&to=2026-05-07"
  params:
    - name: from
      value: "2026-05-01"
      type: query
      description: First day to include (YYYY-MM-DD). Disable it to start from the beginning of the log.
    - name: to
      value: "2026-05-07"
      type: query
      description: Last day to include (YYYY-MM-DD). Disable it to run to the end of the log.
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
