# fly.toml app configuration file generated for susi-air-pilot on 2026-10-05T02:34:58Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'susi-air-pilot'
primary_region = 'sin'
swap_size_mb = 512

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
