# fly.toml app configuration file generated for susi-air-pilot on 2026-10-05T02:34:58Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'susi-air-pilot'
primary_region = 'sin'
swap_size_mb = 512

[build]

[http_service]
  internal_port = 3001
  force_https = true
  # Exactly one machine, always on: refresh tokens live in the app's memory, so a second
  # machine wouldn't know them and a stopped machine forgets them (everyone signed out).
  # Keep the machine count at 1 too: `fly scale count 1`. Revisit with a shared token store.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
